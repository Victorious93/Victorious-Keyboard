name: 🐛 Bug report
description: Something does not work as expected
labels:
  - "bug"
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first and give the report a specific title.
        **Do not paste passwords, tokens or clipboard contents.** Redact anything private from logs and screenshots.
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: input
    id: version
    attributes:
      label: Victorious Keyboard version (Settings → About)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: e.g. Pixel 8, Android 15
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App you were typing in (if relevant)
      placeholder: e.g. Termux 0.118, Chrome, Signal
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed private data from everything I attached.
          required: true
