name: 💥 Crash report
description: The keyboard or settings app crashed
labels:
  - "bug"
  - "crash"
body:
  - type: markdown
    attributes:
      value: |
        Paste the crash log generated by the app's crash screen. **Check it for private text before posting.**
  - type: textarea
    id: log
    attributes:
      label: Crash log
      render: text
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What were you doing?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed private data from the log.
          required: true
